server:
  port: 8080

spring:
  application:
    name: proxy-service
  datasource:
    url: jdbc:postgresql://postgres:5432/edhir
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
