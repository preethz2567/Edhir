name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  proxy-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Start Integration Services
        run: docker-compose -f infra/docker-compose.ci.yml up -d
        
      - name: Wait for services
        run: sleep 15
          
      - name: Build with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/edhir
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_RABBITMQ_HOST: localhost
          EDHIR_DEMO_APP_URL: http://localhost:5000
        run: mvn -B clean test checkstyle:check --file proxy-service/pom.xml
        
      - name: Stop Services
        if: always()
        run: docker-compose -f infra/docker-compose.ci.yml down

  ml-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Start Integration Services
        run: docker-compose -f infra/docker-compose.ci.yml up -d
        
      - name: Wait for services
        run: sleep 15
          
      - name: Install dependencies
        run: |
          cd ml-service
          python -m pip install --upgrade pip
          pip install -e .[test]
          
      - name: Lint with flake8
        run: |
          cd ml-service
          flake8 .
          
      - name: Test with pytest
        env:
          POSTGRES_HOST: localhost
          RABBITMQ_HOST: localhost
        run: |
          cd ml-service
          pytest

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
          
      - name: Install dependencies
        run: |
          cd dashboard
          npm ci
          
      - name: Lint with ESLint
        run: |
          cd dashboard
          npm run lint
          
      - name: Run Tests
        run: |
          cd dashboard
          npm run test -- --run
