<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edhir Dashboard</title>
  </head>
  <body>
    <div id="debug" style="position:fixed; top:0; left:0; z-index:999999; background:white; color:red; padding:10px; font-family:monospace; pointer-events:none;"></div>
    <script>
      window.addEventListener('error', (event) => {
        document.getElementById('debug').innerHTML += `<p>${event.message} at ${event.filename}:${event.lineno}</p>`;
      });
      window.addEventListener('unhandledrejection', (event) => {
        document.getElementById('debug').innerHTML += `<p>Promise Rejection: ${event.reason}</p>`;
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
