version: '3.8'

services:
  proxy-service:
    build: ../proxy-service
    ports:
      - "8080:8080"
    depends_on:
      - ml-service
      - demo-app
      - redis
      - rabbitmq
      - postgres

  ml-service:
    build: ../ml-service
    expose:
      - "8000"

  nginx-ml:
    image: nginx:alpine
    ports:
      - "8443:443"
    volumes:
      - ./nginx/ml-service.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  demo-app:
    build: ../demo-app
    expose:
      - "5000"

  nginx-demo:
    image: nginx:alpine
    ports:
      - "9443:443"
    volumes:
      - ./nginx/demo-app.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  cert-generator:
    image: alpine/openssl
    command: >
      sh -c "if [ ! -f /certs/cert.pem ]; then
        openssl req -newkey rsa:2048 -nodes -keyout /certs/key.pem -x509 -days 365 -out /certs/cert.pem -subj '/CN=localhost';
      fi"
    volumes:
      - certs:/certs

  dashboard:
    build: ../dashboard
    ports:
      - "3000:3000"

  redis:
    image: redis:alpine
    expose:
      - "6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    expose:
      - "5672"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  certs:
