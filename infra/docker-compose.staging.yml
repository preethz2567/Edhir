version: '3.8'

services:
  proxy-service:
    build: ../proxy-service
    ports:
      - "8080:8080"
    depends_on:
      - ml-service
      - demo-app
      - redis
      - rabbitmq
      - postgres

  ml-service:
    build: ../ml-service
    # Port removed for staging, assuming internal routing
    expose:
      - "8000"

  demo-app:
    build: ../demo-app
    expose:
      - "5000"

  dashboard:
    build: ../dashboard
    ports:
      - "3000:3000"

  redis:
    image: redis:alpine
    expose:
      - "6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    expose:
      - "5672"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
