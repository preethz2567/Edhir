version: '3.8'

# Placeholder for production configuration
# Expected to use pre-built images from a container registry rather than building from source
services:
  proxy-service:
    image: registry.example.com/edhir-proxy-service:latest
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - rabbitmq
      - postgres

  ml-service:
    image: registry.example.com/edhir-ml-service:latest
    expose:
      - "8000"

  demo-app:
    image: registry.example.com/edhir-demo-app:latest
    expose:
      - "5000"

  dashboard:
    image: registry.example.com/edhir-dashboard:latest
    ports:
      - "80:80"

  redis:
    image: redis:alpine
    expose:
      - "6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    expose:
      - "5672"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
