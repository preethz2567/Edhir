services:
  target-demo-app:
    build: ../demo-app
    # Intentionally no exposed ports, reachable only via sidecar

  sidecar:
    build: ../proxy-service
    ports:
      - "8443:8080"
    environment:
      - EDHIR_DEMO_APP_URL=http://target-demo-app:5000
    depends_on:
      - target-demo-app

networks:
  default:
    name: infra_default
    external: true
